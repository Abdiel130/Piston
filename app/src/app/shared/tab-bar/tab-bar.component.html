<nav class="tabbar" aria-label="Navegación principal">
  <ul class="tabbar__list">
    @for (tab of tabs; track tab.path) {
      <li class="tabbar__item">
        <a
          class="tabbar__link"
          [routerLink]="tab.path"
          [class.is-active]="isActive(tab)"
          [attr.aria-current]="isActive(tab) ? 'page' : null"
        >
          <span class="tabbar__icon">
            <pst-icon [name]="tab.icon" [size]="24" />
            @if (tab.path === '/' && garageAlerts(); as alerts) {
              <span [class]="'tabbar__badge tabbar__badge--' + alerts.tone" [attr.aria-label]="alerts.count + (alerts.count === 1 ? ' aviso' : ' avisos')">
                {{ alerts.count > 9 ? '9+' : alerts.count }}
              </span>
            }
          </span>
          <span class="tabbar__label">{{ tab.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
